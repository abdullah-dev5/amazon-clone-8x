name: CI

# Verification only — this does NOT deploy anything. Vercel deploys the
# app independently (connected directly to this repo); this workflow's
# only job is to catch a broken commit before it gets there.
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest

    # A fresh, disposable Postgres for this run only — created and
    # destroyed with the job. Seeding it below is seeding *this* throwaway
    # database so the test suite has data to exercise, not production —
    # nothing here ever touches the real (Neon) database, which has no
    # credentials available to this workflow at all.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: amazonw_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/amazonw_ci
      # CI-only, never used anywhere real — just needs to exist so
      # session-signing code doesn't throw during the build/test run.
      SESSION_SECRET: ci-only-session-secret-not-for-real-use
      CI: true

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: ESLint
        run: npm run lint

      - name: Production build
        run: npm run build

      # Everything from here down only exists to give the Playwright suite
      # a real, running app + database to test against.
      - name: Apply migrations to the CI database
        run: npx prisma migrate deploy

      - name: Seed the CI database (ephemeral — this job's Postgres only)
        run: npm run db:seed

      - name: Install Playwright's Chromium browser
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests
        run: npx playwright test

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
          if-no-files-found: ignore
